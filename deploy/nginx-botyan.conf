# /etc/nginx/sites-available/botyan.conf
# HTTP-only. После перевода DNS запустить:
#   certbot --nginx -d botyan.dev -d www.botyan.dev --redirect
# certbot сам допишет 443-й server-блок и редирект с 80.

server {
    listen 80;
    listen [::]:80;
    server_name botyan.dev www.botyan.dev;

    root /var/www/botyan/dist;
    index index.html;

    charset utf-8;

    # Логи
    access_log /var/log/nginx/botyan.access.log;
    error_log  /var/log/nginx/botyan.error.log;

    # Заголовки безопасности
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss image/svg+xml application/manifest+json;

    client_max_body_size 1m;

    # API формы обратной связи (contact-server.mjs на 127.0.0.1:3101)
    location /api/contact {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Хешированные ассеты Vite: кешируем навсегда
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Картинки и шрифты из public/
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # index.html не кешируем, иначе клиенты залипают на старой сборке
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # SPA + пререндер: сначала файл, потом index.html внутри каталога маршрута
    # (их создаёт scripts/prerender.ts), в последнюю очередь корневой index.html
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
